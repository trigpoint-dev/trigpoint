[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trigpoint"
version = "0.0.1"
description = "Safe, budgeted repo grounding for LLMs and agents: GitHub App auth, hardened shared clones, structured RepoMap."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "trigpoint contributors" }]
keywords = ["llm", "agents", "github", "code-grounding", "repo-map", "mcp"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pathspec>=1.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
trigpoint = "trigpoint.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/trigpoint-dev/trigpoint"
Issues = "https://github.com/trigpoint-dev/trigpoint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/trigpoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
